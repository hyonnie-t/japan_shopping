<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EE">
<title>일본 쇼핑 도감 · 디자인 미리보기</title>
<style>
@font-face{font-family:"Jua";src:url("fonts/Jua-Regular.ttf") format("truetype");font-display:swap}
:root{
  --paper:#FFF6EE; --dot:#F7DCCD; --card:#FFFFFF; --ink:#5A4038; --sub:#7A6057; --faint:#85695F; --line:#F3DACD;
  --pink:#D23F6A; --pink-deep:#B52F58; --pink-soft:#FFE3EB; --mint:#2A7F62; --mint-soft:#DDF4EA; --butter:#FFE08A; --butter-soft:#FFF4CF; --lav:#CDB8F2;
  --pop:0 3px 0 #F1D2C4; --pop-pink:0 3px 0 #9E2A4C;
  --shadow:0 2px 0 #F3DACD,0 8px 20px rgba(160,100,80,.08);
  --r:24px;
  --cute:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --kr:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;
  --jp:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  --c-뷰티:#FFD9E4; --c-헤어바디:#D6ECFF; --c-드럭스토어건강:#D8F2E5; --c-생활용품:#FFEBC8; --c-먹거리:#FFE1C6; --c-기타:#E8DEFB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:var(--kr);font-size:16px;line-height:1.5}
body{background:var(--paper) radial-gradient(var(--dot) 1.3px,transparent 1.5px) 0 0/20px 20px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:active{transform:translateY(2px)}
.jp{font-family:var(--jp)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.preview-flag{background:var(--pink-soft);color:var(--pink-deep);text-align:center;font-size:12px;font-weight:700;padding:5px 12px;letter-spacing:.02em}

/* 머리 */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,246,238,.9);backdrop-filter:blur(10px);border-bottom:2px dashed var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--line)}
.logo small{color:var(--pink);font-size:15px}
.rate{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 12px;font-size:13px;color:var(--sub);min-height:44px;box-shadow:var(--pop);font-weight:700}
.rate input{width:54px;border:0;background:var(--butter-soft);border-radius:999px;padding:6px 8px;text-align:center;font-weight:900;color:var(--ink)}

/* 요약 */
.summary{position:relative;margin:14px 0 6px;background:var(--pink-soft);border:2px solid #FFC9D8;border-radius:26px;padding:14px 16px 12px;display:grid;gap:8px;box-shadow:0 3px 0 #FFC1D2;overflow:hidden}
.summary .mascot{position:absolute;right:-4px;top:-4px;width:74px;height:74px;object-fit:cover;border-radius:50%;opacity:.95;transform:rotate(8deg)}
.sum-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-right:58px}
.sum-label{font-size:13px;color:var(--pink-deep);font-weight:800}
.sum-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sum-big .yen{font-size:28px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
.sum-big .won{font-size:15px;color:var(--sub);font-weight:700}
.sum-done{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap;background:#fff;border-radius:16px;padding:4px 10px;text-align:center;border:2px solid #FFD3DF}
.sum-done b{display:block;font-size:18px;color:var(--pink-deep)}
.bar{height:12px;background:#fff;border-radius:99px;overflow:hidden;border:2px solid #FFD3DF}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s;background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,#FF9DB8 8px 16px)}
.note{font-size:12px;color:var(--sub)}

/* 검색·필터 */
.tools{padding:8px 0 4px}
.search{display:flex;gap:8px}
.search input{flex:1;min-height:48px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:0 18px;font-size:16px;box-shadow:var(--pop)}
.search input:focus{outline:none;border-color:var(--pink)}
.iconbtn{min-width:48px;min-height:48px;border:2px solid var(--line);background:var(--card);border-radius:50%;display:grid;place-items:center;box-shadow:var(--pop);color:var(--sub)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:14px;font-weight:700;white-space:nowrap;box-shadow:var(--pop);color:var(--sub)}
.chip[aria-pressed=true]{background:var(--pink);color:#fff;border-color:var(--pink-deep);box-shadow:var(--pop-pink)}
.subtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--sub);font-weight:700}
.subtools select{min-height:42px;border:2px solid var(--line);border-radius:999px;background:var(--card);padding:0 12px;font-weight:700;color:var(--sub)}
.toggle{display:flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border:2px solid var(--line);border-radius:999px;background:var(--card)}
.toggle input{accent-color:var(--pink);width:18px;height:18px}
.count{margin-left:auto;background:var(--butter-soft);border-radius:999px;padding:2px 10px}

/* 격자 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;position:relative;border:2px solid var(--line);padding:6px;text-align:left;display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:rotate(-.6deg) translateY(-2px)}
.ph{aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:18px;background-image:radial-gradient(rgba(255,255,255,.7) 2px,transparent 2.5px);background-size:16px 16px}
.ph .emo{font-size:clamp(34px,10vw,52px);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.06))}
.ph .brand{position:absolute;left:50%;bottom:12%;transform:translateX(-50%) rotate(-3deg);font-family:var(--jp);font-weight:800;font-size:clamp(12px,3.4vw,15px);color:var(--ink);background:#fff;border-radius:999px;padding:3px 12px;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(90,64,56,.12)}
.ph .cat{display:none}
.ph .prio{position:absolute;right:6px;top:6px;border-radius:999px;font-size:11px;padding:3px 9px;font-weight:800;transform:rotate(4deg)}
.prio.must{background:var(--pink);color:#fff}.prio.maybe{background:#fff;color:var(--mint)}.prio.price{background:var(--butter);color:#6E5400}
.card .body{padding:10px 6px 6px;display:grid;gap:2px}
.card .jpname{font-family:var(--jp);font-weight:800;font-size:15px;line-height:1.3}
.card .krname{font-size:15px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .price{font-weight:900;font-size:16px;margin-top:2px;color:var(--pink-deep)}
.card .price small{font-weight:700;color:var(--sub);font-size:12px}
.card .price.none{color:var(--faint);font-weight:700;font-size:13px}
.card.bought .ph{background-color:#F1E9E5}
.card.bought .ph > :not(.done-stamp){filter:saturate(.2);opacity:.45}
.card.bought .body{opacity:.55}
.done-stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.done-stamp span{border:3px dashed var(--pink-deep);color:var(--pink-deep);border-radius:50%;width:86px;height:86px;display:grid;place-items:center;font-family:var(--jp);font-weight:900;font-size:17px;line-height:1.1;text-align:center;transform:rotate(-12deg);background:rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(255,255,255,.9)}
.need{display:inline-block;font-size:11px;font-weight:800;color:#86650A;background:var(--butter-soft);border-radius:999px;padding:2px 8px;margin-top:4px;justify-self:start}

/* 목록 보기 */
.grid.list{grid-template-columns:1fr}
.grid.list .card{flex-direction:row;align-items:stretch;gap:6px}
.grid.list .ph{width:96px;flex:none}
.grid.list .ph .brand,.grid.list .ph .prio{display:none}
.grid.list .done-stamp span{width:58px;height:58px;font-size:12px}

/* 아래 탭 */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 4px 0 #F1D2C4,0 10px 26px rgba(160,100,80,.14)}
.tab{border:0;background:none;min-height:54px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--sub);padding:4px 0}
.tab .ti{font-size:22px;line-height:1}
.tab[aria-current=true]{background:var(--pink-soft);color:var(--pink-deep)}
.fab{position:fixed;right:max(18px,calc(50% - 600px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:31;width:60px;height:60px;border-radius:50%;border:4px solid #fff;background:var(--pink);color:#fff;box-shadow:var(--pop-pink),0 8px 18px rgba(240,87,127,.35);display:grid;place-items:center}
.fab svg{width:28px;height:28px}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(90,64,56,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.25,1.05);padding-bottom:calc(20px + env(safe-area-inset-bottom));border-top:3px solid #fff}
.sheet.on{transform:none}
.grab{width:48px;height:6px;border-radius:9px;background:#F1CDBE;margin:8px auto 4px}
.sheet-close{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;z-index:2;color:var(--sub);box-shadow:var(--pop)}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 14px 0;gap:10px}
.slider::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:4/3;display:grid;place-items:center;position:relative;border-radius:24px;background-image:radial-gradient(rgba(255,255,255,.7) 2.5px,transparent 3px);background-size:20px 20px}
.slide .lbl{position:absolute;left:12px;bottom:12px;background:#fff;color:var(--sub);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.dots{display:flex;justify-content:center;gap:6px;padding:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:#F1CDBE}.dots i.on{background:var(--pink);width:20px;border-radius:9px}
.d-body{padding:2px 16px 8px;display:grid;gap:14px}
.d-jp{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:2px solid var(--line)}
.d-jp .big{font-family:var(--jp);font-size:28px;font-weight:800;line-height:1.25}
.d-jp .big.empty{font-size:16px;color:var(--faint);font-weight:700}
.d-jp .brandjp{font-family:var(--jp);font-size:18px;color:var(--sub);font-weight:700}
.d-jp .kr{font-size:17px;margin-top:4px;font-weight:800}
.btn{min-height:50px;border-radius:999px;border:2px solid var(--line);background:var(--card);padding:0 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--pop)}
.btn.primary{background:var(--pink);border-color:var(--pink-deep);color:#fff;box-shadow:var(--pop-pink)}
.btn.dark{background:var(--mint);border-color:#236B53;color:#fff;box-shadow:0 3px 0 #1D5A46}
.btn.block{width:100%}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbox{background:var(--card);border-radius:20px;padding:12px 14px;border:2px solid var(--line)}
.pbox .k{font-size:12px;color:var(--sub);font-weight:700}.pbox .v{font-size:20px;font-weight:900}
.pbox:first-child{background:var(--pink-soft);border-color:#FFCCDA}
.pbox.gain{grid-column:1/-1;background:var(--mint-soft);border-color:#BFE8D7}
.pbox.gain .v{color:var(--mint)}
.sec h3{font-size:14px;color:var(--pink-deep);margin:0 0 6px;font-weight:900}
.sec h3::before{content:"♡ "}
.sec p{margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.tag.warn{background:var(--butter-soft);border-color:#F5E1A0;color:#8A6A00}
.src{font-size:14px;color:var(--sub);word-break:break-all}
.src a{color:var(--ink)}
.sticky-act{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 35%);padding:16px 16px 0;display:flex;gap:8px}

/* 구매 입력 */
.form{padding:8px 16px;display:grid;gap:12px}
.form h2{margin:4px 50px 0 0;font-size:20px;font-weight:900}
.field{display:grid;gap:4px;font-size:14px;color:var(--sub);font-weight:700}
.field input,.field select{min-height:50px;border:2px solid var(--line);border-radius:18px;background:var(--card);padding:0 14px;font-size:17px;color:var(--ink);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:18px;background:var(--card);min-height:50px}
.stepper button{width:48px;height:48px;border:0;background:none;font-size:22px;color:var(--pink-deep);font-weight:900}
.stepper output{flex:1;text-align:center;font-size:18px;font-weight:900;color:var(--ink)}

/* 직원에게 보여주기 */
.show{position:fixed;inset:0;z-index:60;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:18px}
.show.on{display:flex}
.show .q{font-family:var(--jp);font-size:22px;color:var(--sub);background:var(--pink-soft);border-radius:999px;padding:6px 18px}
.show .name{font-family:var(--jp);font-size:clamp(34px,9vw,64px);font-weight:900;line-height:1.2;color:#2E2420}
.show .brand{font-family:var(--jp);font-size:24px}
.show .hint{font-size:14px;color:var(--faint)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:999px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:12px;z-index:70;opacity:0;pointer-events:none;transition:.2s;font-size:15px;font-weight:700;max-width:calc(100% - 32px);width:max-content}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;white-space:nowrap;min-height:40px;border:0;border-radius:999px;background:var(--pink);color:#fff;padding:0 14px;font-weight:800}

/* 매장 모드 */
.store-head{margin:14px 0 4px;display:flex;align-items:center;gap:10px}
.store-head img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#fff}
.store-head h2{margin:0;font-size:22px;font-weight:900}
.store-head p{margin:0;color:var(--sub);font-size:14px}
.big-list{display:grid;gap:14px;margin-top:10px}
.bigcard{display:grid;grid-template-columns:128px 1fr;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid var(--line);overflow:hidden;min-height:132px;padding:6px;gap:4px}
.bigcard .ph{aspect-ratio:auto}
.bigcard .ph .brand{font-size:13px}
.bigcard .ph .prio{display:none}
.bigcard .info{padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.bigcard .jpname{font-family:var(--jp);font-size:20px;font-weight:800;line-height:1.25}
.bigcard .act{margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:space-between}
.bigcard .act > span{white-space:nowrap;font-size:15px;font-weight:900;color:var(--pink-deep)}
.check{min-height:48px;min-width:112px;border-radius:999px;border:2px solid var(--pink-deep);background:#fff;color:var(--pink-deep);font-weight:900;box-shadow:var(--pop-pink)}
.bigcard.bought{opacity:.6}
.bigcard.bought .check{background:var(--pink);color:#fff}
.empty-msg{padding:40px 16px;text-align:center;color:var(--sub);font-weight:700}

/* 정리 */
.report{display:grid;gap:14px;margin-top:14px}
.rcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid var(--line);padding:16px}
.rcard h3{margin:0 0 8px;font-size:16px;font-weight:900}
.rline{display:flex;justify-content:space-between;padding:8px 0;border-top:2px dotted var(--line);font-size:15px;gap:10px}
.rline:first-of-type{border-top:0}

/* 둥근 글꼴: 제목·숫자·버튼에만 (긴 글은 시스템 글꼴) */
.logo,.sum-label,.sum-big,.sum-done,.chip,.toggle,.subtools select,.count,.tab,.btn,.check,.card .krname,.card .price,.need,.prio,.store-head h2,.d-jp .kr,.pbox .v,.sec h3,.form h2,.rcard h3,.toast,.preview-flag,.rate,.bigcard .info > div:nth-child(2),.bigcard .act > span{font-family:var(--cute);font-weight:400!important;letter-spacing:0}

/* 폭 */
@media (min-width:600px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media (min-width:768px){
  .grid{gap:16px}
  .card .jpname{font-size:16px}
  .summary{grid-template-columns:1.3fr 1fr;align-items:center;padding:16px 120px 16px 20px}
  .summary .mascot{width:120px;height:120px;right:-4px;top:auto;bottom:-18px}
  .sum-top,.bar,.note{padding-right:0;margin-right:0}
  .sheet{left:50%;right:auto;width:600px;bottom:auto;top:50%;border-radius:28px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.22s;max-height:88vh;border:3px solid #fff}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
  .slide{aspect-ratio:auto;height:min(280px,32vh)}
  .big-list{grid-template-columns:1fr 1fr}
  .report{grid-template-columns:1fr 1fr}
}
@media (min-width:1024px){ .grid{grid-template-columns:repeat(4,1fr)} .big-list{grid-template-columns:repeat(3,1fr)} .bigcard{grid-template-columns:1fr;grid-template-rows:190px auto} .report{grid-template-columns:1fr 1fr 1fr} }
@media (min-width:1240px){ .grid{grid-template-columns:repeat(5,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="preview-flag">디자인 미리보기 · 사진은 자리표시자, 저장은 이 기기에서만</div>
<header class="top"><div class="top-in">
  <div class="logo"><img src="images/mascot-320.png" alt="">일본 쇼핑 도감<small>♡</small></div>
  <label class="rate" title="최근 1년 평균 9.20원이 기본값">1엔 = <input id="rate" inputmode="decimal" aria-label="환율 1엔당 원">원</label>
</div></header>

<main class="wrap" id="main"></main>

<button class="fab" id="fab" aria-label="상품 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs"><div class="tabs-in">
  <button class="tab" data-tab="list"><span class="ti" aria-hidden="true">🎀</span>도감</button>
  <button class="tab" data-tab="store"><span class="ti" aria-hidden="true">🏪</span>매장 모드</button>
  <button class="tab" data-tab="report"><span class="ti" aria-hidden="true">🧾</span>정리</button>
  <button class="tab" data-tab="set"><span class="ti" aria-hidden="true">⚙️</span>설정</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="show" id="show"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">되돌리기</button></div>

<script>
const DEFAULT_RATE = 9.20; // 최근 1년 평균(Wise 중간 환율, 2026-10-27 확인)
const LS = 'japan_shopping_preview_v1';
const CAT_ORDER = ['뷰티','헤어·바디','드럭스토어 건강','생활용품','먹거리','기타'];
const CAT_EMO = {'뷰티':'💄','헤어·바디':'🧴','드럭스토어 건강':'💊','생활용품':'🏠','먹거리':'🍡','기타':'🎀'};
const PRIO = {'꼭 살 것':'must','있으면 살 것':'maybe','가격 보고 결정':'price'};
let data = { 상품: [], 판매처목록: [] };
let st = load();
function load(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e){} }
st.rate ??= DEFAULT_RATE; st.bought ??= {}; st.tab ??= 'list'; st.view ??= 'grid';
let ui = { q:'', cat:'전체', onlyTodo:false, sort:'prio', store: null, withUnknown:true };

const $ = s => document.querySelector(s);
const yen = n => n==null ? '' : '¥' + Math.round(n).toLocaleString('ko-KR');
const won = n => n==null ? '' : '₩' + (Math.round(n/10)*10).toLocaleString('ko-KR');
const catVar = c => `var(--c-${c.replace(/[·\s]/g,'')})`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

// 예상가: 세금 포함 기준, 판매처 가격 중 가장 비싼 값으로 넉넉하게
function estPrice(p){
  const c = [];
  if (p.엔화_세금포함) c.push(p.엔화_세금포함);
  else if (p.엔화_세금별도) c.push(p.엔화_세금별도 * (1 + (p.세율 ?? .1)));
  (p.판매처||[]).forEach(s => s.가격 && c.push(s.가격));
  return c.length ? Math.max(...c) : null;
}
const isBought = p => !!st.bought[p.id];

function totals(){
  let est = 0, unknown = 0, real = 0, done = 0, korea = 0, saved = 0;
  data.상품.forEach(p => {
    const e = estPrice(p), q = p.목표개수 || 1;
    if (e == null) unknown++; else est += e * q;
    const b = st.bought[p.id];
    if (b){ done++; real += (b.가격 || 0) * (b.개수 || 1);
      if (p.한국가격?.금액 && b.가격) saved += (p.한국가격.금액 - b.가격 * st.rate) * (b.개수 || 1); }
  });
  return { est, unknown, real, done, total: data.상품.length, saved };
}

function ph(p, big){
  const brand = p.브랜드_일본어 || p.브랜드_한글 || '';
  return `<div class="ph" style="background:${catVar(p.대분류)}">
    <span class="cat">${esc(p.대분류)}</span>
    <span class="prio ${PRIO[p.우선순위]||'maybe'}">${esc(p.우선순위)}</span>
    <span class="emo" aria-hidden="true">${CAT_EMO[p.대분류]||'🎀'}</span>
    <span class="brand">${esc(brand)}</span>
    ${isBought(p) ? '<div class="done-stamp"><span>購入済<br>♡</span></div>' : ''}
  </div>`;
}

function render(){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab === st.tab));
  $('#fab').style.display = st.tab === 'list' ? '' : 'none';
  ({ list: renderList, store: renderStore, report: renderReport, set: renderSet })[st.tab]();
}

function summaryHTML(){
  const t = totals();
  const pct = t.total ? Math.round(t.done / t.total * 100) : 0;
  return `<section class="summary" aria-label="요약"><img class="mascot" src="images/mascot-320.png" alt="">
    <div class="sum-top">
      <div>
        <div class="sum-label">예상 합계 · 넉넉하게 ♡</div>
        <div class="sum-big"><span class="yen">${yen(t.est)}</span><span class="won">${won(t.est * st.rate)}</span></div>
      </div>
      <div class="sum-done">산 것<b>${t.done} / ${t.total}</b></div>
    </div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="note">${t.done ? `실제 쓴 돈 ${yen(t.real)} (${won(t.real*st.rate)}) · ` : ''}세금 포함 · 가격 미정 ${t.unknown}개는 빠져 있어요</div>
  </section>`;
}

function filtered(){
  const q = ui.q.trim().toLowerCase();
  let list = data.상품.filter(p => {
    if (ui.cat !== '전체' && p.대분류 !== ui.cat) return false;
    if (ui.onlyTodo && isBought(p)) return false;
    if (!q) return true;
    return [p.이름_한글, p.이름_일본어, p.읽는법, p.브랜드_한글, p.브랜드_일본어, p.세부분류].join(' ').toLowerCase().includes(q);
  });
  const pr = p => ({'꼭 살 것':0,'있으면 살 것':1,'가격 보고 결정':2}[p.우선순위] ?? 3);
  const cmp = { prio:(a,b)=>pr(a)-pr(b), price:(a,b)=>(estPrice(a)??1e9)-(estPrice(b)??1e9), name:(a,b)=>a.이름_한글.localeCompare(b.이름_한글,'ko') }[ui.sort];
  return list.sort((a,b) => (isBought(a)-isBought(b)) || cmp(a,b));
}

function renderList(){
  const cats = ['전체', ...CAT_ORDER.filter(c => data.상품.some(p => p.대분류 === c))];
  $('#main').innerHTML = summaryHTML() + `
  <div class="tools">
    <div class="search">
      <input id="q" type="search" placeholder="한글·일본어·브랜드로 찾기" value="${esc(ui.q)}" aria-label="검색">
      <button class="iconbtn" id="view" aria-label="${st.view==='grid'?'목록 보기로':'사진 격자로'}">${st.view==='grid'
        ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>'
        : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'}</button>
    </div>
    <div class="chips" role="group" aria-label="대분류">${cats.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${ui.cat===c}">${CAT_EMO[c]? CAT_EMO[c]+' ' : ''}${c}</button>`).join('')}</div>
    <div class="subtools">
      <label class="toggle"><input type="checkbox" id="todo" ${ui.onlyTodo?'checked':''}> 살 것만</label>
      <select id="sort" aria-label="정렬">
        <option value="prio" ${ui.sort==='prio'?'selected':''}>우선순위순</option>
        <option value="price" ${ui.sort==='price'?'selected':''}>가격순</option>
        <option value="name" ${ui.sort==='name'?'selected':''}>이름순</option>
      </select>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div class="grid ${st.view==='list'?'list':''}" id="grid"></div>`;
  drawGrid();
  $('#q').addEventListener('input', e => { ui.q = e.target.value; drawGrid(); });
  $('#view').onclick = () => { st.view = st.view==='grid' ? 'list' : 'grid'; save(); renderList(); };
  $('#todo').onchange = e => { ui.onlyTodo = e.target.checked; drawGrid(); };
  $('#sort').onchange = e => { ui.sort = e.target.value; drawGrid(); };
  document.querySelectorAll('.chip[data-cat]').forEach(b => b.onclick = () => { ui.cat = b.dataset.cat; renderList(); });
}

function drawGrid(){
  const list = filtered();
  $('#count').textContent = `${list.length}개`;
  $('#grid').innerHTML = list.length ? list.map(p => {
    const e = estPrice(p);
    return `<button class="card ${isBought(p)?'bought':''}" data-id="${p.id}" aria-label="${esc(p.이름_한글)} 자세히">
      ${ph(p)}
      <div class="body">
        ${p.이름_일본어 ? `<div class="jpname">${esc(p.이름_일본어)}</div>` : ''}
        <div class="krname">${esc(p.이름_한글)}</div>
        ${e!=null ? `<div class="price">${yen(e)} <small>${won(e*st.rate)}</small></div>` : '<div class="price none">가격 미정</div>'}
        ${(p.확인필요||[]).length ? `<span class="need">확인 필요 ${p.확인필요.length}</span>` : ''}
      </div>
    </button>`;
  }).join('') : '<p class="empty-msg">맞는 상품이 없어요. 검색어나 분류를 바꿔 보세요.</p>';
  document.querySelectorAll('.card').forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

/* 상세 */
function openSheet(html){ $('#sheet').innerHTML = html; $('#sheet').scrollTop = 0; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ $('#show').classList.remove('on'); closeSheet(); } });

function openDetail(id){
  const p = data.상품.find(x => x.id === id); if (!p) return;
  const e = estPrice(p), b = st.bought[p.id];
  const slides = ['정면','뒷면','진열대'];
  const gain = p.한국가격?.금액 && e ? p.한국가격.금액 - e * st.rate : null;
  openSheet(`<div class="grab"></div><button class="sheet-close" aria-label="닫기">×</button>
    <div class="slider" id="slider">${slides.map(s => `<div class="slide" style="background:${catVar(p.대분류)}"><span style="display:grid;place-items:center;gap:10px"><span style="font-size:64px;line-height:1">${CAT_EMO[p.대분류]||'🎀'}</span><span class="jp" style="font-size:18px;font-weight:800;background:#fff;border-radius:999px;padding:4px 16px;transform:rotate(-3deg)">${esc(p.브랜드_일본어||p.브랜드_한글)}</span></span><span class="lbl">${s} · 사진 넣기 전</span></div>`).join('')}</div>
    <div class="dots" id="dots">${slides.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>
    <div class="d-body">
      <div class="d-jp">
        <div class="brandjp">${esc(p.브랜드_일본어 || p.브랜드_한글)}</div>
        <div class="big ${p.이름_일본어?'':'empty'}">${p.이름_일본어 ? esc(p.이름_일본어) : '일본어 이름 확인 필요'}</div>
        ${p.읽는법 ? `<div class="jp" style="color:var(--sub)">${esc(p.읽는법)}</div>` : ''}
        <div class="kr">${esc(p.이름_한글)}</div>
        <button class="btn dark block" id="showBtn" style="margin-top:12px">직원에게 보여 주기 (크게)</button>
      </div>
      <div class="prices">
        <div class="pbox"><div class="k">세금 포함</div><div class="v">${e!=null?yen(e):'—'}</div></div>
        <div class="pbox"><div class="k">원화 (₩${st.rate}/¥)</div><div class="v">${e!=null?won(e*st.rate):'—'}</div></div>
        <div class="pbox"><div class="k">세금 별도 (${Math.round((p.세율??.1)*100)}%)</div><div class="v">${e!=null?yen(e/(1+(p.세율??.1))):'—'}</div></div>
        <div class="pbox"><div class="k">한국 가격</div><div class="v">${p.한국가격?.금액?won(p.한국가격.금액):'—'}</div></div>
        ${gain!=null ? `<div class="pbox gain"><div class="k">일본에서 사면</div><div class="v">${gain>=0?won(gain)+' 이득':won(-gain)+' 손해'}</div></div>` : ''}
      </div>
      <div class="sec"><h3>특징</h3><p>${esc(p.특징?.한줄||'—')}</p></div>
      <div class="sec"><h3>어디서 살까</h3><div class="tags">${(p.판매처||[]).length ? p.판매처.map(s=>`<span class="tag">${esc(s.이름)}${s.가격?' '+yen(s.가격):''}</span>`).join('') : '<span class="tag">판매처 미정</span>'}</div></div>
      ${p.메모 ? `<div class="sec"><h3>메모</h3><p>${esc(p.메모)}</p></div>` : ''}
      ${(p.확인필요||[]).length ? `<div class="sec"><h3>확인 필요</h3><div class="tags">${p.확인필요.map(x=>`<span class="tag warn">${esc(x)}</span>`).join('')}</div></div>` : ''}
      <div class="sec src"><h3>출처</h3>${(p.추천이유_출처||[]).map(s=>`<a href="${esc(s.주소)}" target="_blank" rel="noopener">${esc(s.주소.replace('https://',''))}</a>`).join('<br>')}</div>
      ${b ? `<div class="sec"><h3>구매 기록</h3><p>${yen(b.가격)} × ${b.개수}개 · ${esc(b.산곳||'')} · ${esc(b.날짜)}</p></div>` : ''}
    </div>
    <div class="sticky-act">
      ${b ? `<button class="btn block" id="unbuy">구매 취소</button>` : `<button class="btn primary block" id="buy">샀어요 ♡</button>`}
    </div>`);
  $('.sheet-close').onclick = closeSheet;
  $('#showBtn').onclick = () => showStaff(p);
  const sl = $('#slider'); sl.onscroll = () => { const i = Math.round(sl.scrollLeft / sl.clientWidth); document.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on', i===j)); };
  if (b) $('#unbuy').onclick = () => { const prev = st.bought[p.id]; delete st.bought[p.id]; save(); closeSheet(); render(); toast('구매 취소했어요', () => { st.bought[p.id] = prev; save(); render(); }); };
  else $('#buy').onclick = () => openBuy(p);
}

function showStaff(p){
  $('#show').innerHTML = `<div class="q">これを探しています</div>
    ${p.이름_일본어 ? `<div class="brand">${esc(p.브랜드_일본어||'')}</div>` : ''}
    <div class="name">${esc(p.이름_일본어 || p.브랜드_일본어 || p.이름_한글)}</div>
    ${p.색상_호수?.[0]?.번호 ? `<div class="brand">${esc(p.색상_호수[0].번호)}</div>` : ''}
    <div class="hint">화면을 누르면 닫혀요</div>`;
  $('#show').classList.add('on');
}
$('#show').onclick = () => $('#show').classList.remove('on');

function openBuy(p){
  const today = new Date().toISOString().slice(0,10);
  const stores = data.판매처목록;
  let n = p.목표개수 || 1;
  openSheet(`<div class="grab"></div><button class="sheet-close" aria-label="닫기">×</button>
    <div class="form">
      <h2>샀어요 · ${esc(p.이름_한글)}</h2>
      <div class="row2">
        <label class="field">산 가격(¥, 1개)<input id="bp" inputmode="numeric" value="${estPrice(p) ? Math.round(estPrice(p)) : ''}" placeholder="예: 990"></label>
        <div class="field">개수<div class="stepper"><button id="m" aria-label="빼기">−</button><output id="n">${n}</output><button id="pl" aria-label="더하기">+</button></div></div>
      </div>
      <label class="field">산 곳<select id="bs">${stores.map(s=>`<option ${p.판매처?.[0]?.이름===s?'selected':''}>${s}</option>`).join('')}</select></label>
      <label class="field">날짜<input id="bd" type="date" value="${today}"></label>
      <button class="btn primary block" id="ok">구매 완료로 표시</button>
      <p style="margin:0;font-size:13px;color:var(--sub)">가격을 몰라도 그냥 눌러도 돼요. 나중에 고칠 수 있어요.</p>
    </div>`);
  $('.sheet-close').onclick = closeSheet;
  $('#m').onclick = () => { n = Math.max(1, n-1); $('#n').textContent = n; };
  $('#pl').onclick = () => { n++; $('#n').textContent = n; };
  $('#ok').onclick = () => { markBought(p, { 가격: Number($('#bp').value) || null, 개수: n, 산곳: $('#bs').value, 날짜: $('#bd').value }); closeSheet(); };
}

function markBought(p, rec){
  st.bought[p.id] = rec; save(); render();
  toast(`${p.이름_한글.slice(0,14)} 구매 완료`, () => { delete st.bought[p.id]; save(); render(); });
}

let toastT;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; $('#toast').classList.add('on');
  $('#toastUndo').onclick = () => { undo(); $('#toast').classList.remove('on'); };
  clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('on'), 4500);
}

/* 매장 모드 */
function renderStore(){
  const stores = data.판매처목록;
  ui.store ??= stores[0];
  const list = data.상품.filter(p => (p.판매처||[]).some(s => s.이름 === ui.store) || (ui.withUnknown && !(p.판매처||[]).length))
    .sort((a,b) => isBought(a)-isBought(b));
  const left = list.filter(p => !isBought(p)).length;
  $('#main').innerHTML = `<div class="store-head"><img src="images/mascot-320.png" alt=""><div><h2>매장 모드</h2><p>고른 매장에서 살 것만 크게! 누르면 바로 구매 완료</p></div></div>
    <div class="chips" role="group" aria-label="판매처">${stores.map(s=>`<button class="chip" data-st="${s}" aria-pressed="${ui.store===s}">${s}</button>`).join('')}</div>
    <div class="subtools"><label class="toggle"><input type="checkbox" id="unk" ${ui.withUnknown?'checked':''}> 판매처 미정도 보기</label><span class="count">남은 것 ${left}개</span></div>
    <div class="big-list">${list.length ? list.map(p => {
      const e = estPrice(p);
      return `<div class="bigcard ${isBought(p)?'bought':''}">
        ${ph(p,true)}
        <div class="info">
          <div class="jp" style="color:var(--sub);font-size:14px">${esc(p.브랜드_일본어||p.브랜드_한글)}</div>
          ${p.이름_일본어 ? `<div class="jpname">${esc(p.이름_일본어)}</div>` : ''}
          <div style="font-size:17px;font-weight:700;line-height:1.3">${esc(p.이름_한글)}</div>
          <div class="act"><span style="font-weight:800">${e!=null?yen(e):'가격 미정'}</span>
          <button class="check" data-id="${p.id}">${isBought(p)?'샀어요 ♡':'샀어요'}</button></div>
        </div></div>`;
    }).join('') : '<p class="empty-msg">이 매장에서 살 것으로 정한 상품이 없어요.</p>'}</div>`;
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { ui.store = b.dataset.st; renderStore(); });
  $('#unk').onchange = e => { ui.withUnknown = e.target.checked; renderStore(); };
  document.querySelectorAll('.check').forEach(b => b.onclick = () => {
    const p = data.상품.find(x => x.id === b.dataset.id);
    if (isBought(p)) { const prev = st.bought[p.id]; delete st.bought[p.id]; save(); render(); toast('구매 취소했어요', () => { st.bought[p.id] = prev; save(); render(); }); }
    else markBought(p, { 가격: estPrice(p) ? Math.round(estPrice(p)) : null, 개수: p.목표개수 || 1, 산곳: ui.store, 날짜: new Date().toISOString().slice(0,10) });
  });
  document.querySelectorAll('.bigcard .ph').forEach((el, i) => el.onclick = () => openDetail(list[i].id));
}

/* 정리 */
function renderReport(){
  const t = totals();
  const bought = data.상품.filter(isBought), todo = data.상품.filter(p => !isBought(p));
  $('#main').innerHTML = `<div class="store-head"><img src="images/mascot-320.png" alt=""><div><h2>정리</h2><p>산 것과 안 산 것, 쓴 돈을 한눈에</p></div></div>
  <div class="report">
    <div class="rcard"><h3>쓴 돈</h3>
      <div class="rline"><span>실제 합계</span><b>${yen(t.real)} · ${won(t.real*st.rate)}</b></div>
      <div class="rline"><span>처음 예상</span><span>${yen(t.est)} · ${won(t.est*st.rate)}</span></div>
      <div class="rline"><span>한국 가격 대비 절약</span><b style="color:var(--matcha)">${t.saved?won(t.saved):'한국 가격을 넣으면 계산돼요'}</b></div>
    </div>
    <div class="rcard"><h3>산 것 ${bought.length}개</h3>${bought.length ? bought.map(p=>`<div class="rline"><span>${esc(p.이름_한글)}</span><span>${yen(st.bought[p.id].가격)}×${st.bought[p.id].개수}</span></div>`).join('') : '<p style="color:var(--sub);margin:0">아직 없어요</p>'}</div>
    <div class="rcard"><h3>안 산 것 ${todo.length}개</h3>${todo.slice(0,12).map(p=>`<div class="rline"><span>${esc(p.이름_한글)}</span><span style="color:var(--sub)">${esc(p.우선순위)}</span></div>`).join('')}${todo.length>12?`<p style="color:var(--sub);margin:8px 0 0">외 ${todo.length-12}개</p>`:''}</div>
  </div>`;
}

function renderSet(){
  $('#main').innerHTML = `<div class="store-head"><img src="images/mascot-320.png" alt=""><div><h2>설정</h2><p>미리보기라 아래 기능은 아직 동작하지 않아요</p></div></div>
  <div class="report">
    <div class="rcard"><h3>판매처 목록</h3><div class="tags">${data.판매처목록.map(s=>`<span class="tag">${s}</span>`).join('')}</div></div>
    <div class="rcard"><h3>백업</h3><div style="display:grid;gap:8px"><button class="btn" disabled>JSON 내보내기 (사진 포함)</button><button class="btn" disabled>JSON 가져오기</button></div></div>
    <div class="rcard"><h3>미리보기 기록</h3><button class="btn" id="reset">체크 기록 지우기</button></div>
  </div>`;
  $('#reset').onclick = () => { st.bought = {}; save(); toast('체크 기록을 지웠어요', () => {}); };
}

/* 시작 */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { st.tab = t.dataset.tab; save(); window.scrollTo(0,0); render(); });
$('#fab').onclick = () => toast('상품 추가 화면은 다음 단계에서 만들어요', () => {});
const rateIn = $('#rate'); rateIn.value = st.rate;
rateIn.addEventListener('change', () => { const v = parseFloat(rateIn.value); if (v > 0) { st.rate = v; save(); render(); } else rateIn.value = st.rate; });
fetch('data/products.json').then(r => r.json()).then(d => { data = d; render(); })
  .catch(() => { $('#main').innerHTML = '<p class="empty-msg">data/products.json을 읽지 못했어요.</p>'; });
</script>
</body>
</html>
